name: Build EternityKernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      O: out

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang lld bc bison flex libssl-dev libncurses5-dev crossbuild-essential-arm64 git

      - name: Prepare Kernel Config
        run: |
          mkdir -p $O
          # Falls du eine defconfig hast, z.B. lineage_defconfig oder irgendein default:
          cp arch/arm64/configs/defconfig $O/.config || true
          make O=$O ARCH=$ARCH olddefconfig

      - name: Build Kernel
        run: |
          make -j$(nproc) O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE CC=clang LD=ld.lld
