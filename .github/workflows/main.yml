name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev git make gcc-aarch64-linux-gnu clang lld

    - name: Setup environment
      run: |
        mkdir -p out
        export ARCH=arm64
        export O=out
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        make exynos9820-beyond1lte_defconfig O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
        # Standard config
        make exynos9820-beyond1lte_defconfig O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE
        # VDSO/Initramfs deaktivieren
        scripts/config --file $O/.config --disable CONFIG_ARM64_VDSO
        scripts/config --file $O/.config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --file $O/.config --disable CONFIG_INITRAMFS_SOURCE
        make olddefconfig O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE
        make olddefconfig O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export O=out
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LD=ld.lld
        make -j$(nproc) O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE CC=clang LD=ld.lld

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image
