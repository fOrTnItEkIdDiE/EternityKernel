name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make curl

    - name: Download Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Prepare Kernel Config
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PATH

        # Out-of-tree build (alles in 'out' speichern)
        mkdir -p out

        # Lade Default Config direkt ins Out-Verzeichnis
        make O=out exynos9820-beyond1lte_defconfig

        # Optional: Stackprotector und Initramfs deaktivieren
        scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR
        scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        scripts/config --file out/.config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --file out/.config --disable CONFIG_INITRAMFS_SOURCE
        scripts/config --file out/.config --disable CONFIG_ARM64_VDSO

        # Alte Config anpassen (keine Prompts)
        make O=out olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        export CLANG_TRIPLE=aarch64-linux-gnu-

        # Build kernel (Out-of-tree)
        make -j$(nproc) O=out CC=clang LD=ld.lld

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image
