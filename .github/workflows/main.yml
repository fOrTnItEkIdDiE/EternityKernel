name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make gcc-aarch64-linux-gnu

    - name: Download Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Prepare kernel config
      run: |
        mkdir -p out
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export O=out
        # Standard config
        make exynos9820-beyond1lte_defconfig O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

        # Disable stuff that breaks GitHub Actions
        scripts/config --file $O/.config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --file $O/.config --disable CONFIG_INITRAMFS_SOURCE
        scripts/config --file $O/.config --disable CONFIG_ARM64_VDSO
        scripts/config --file $O/.config --disable CONFIG_HAVE_KPROBES
        scripts/config --file $O/.config --disable CONFIG_PROBES

        # Apply your overclock settings (CPU/GPU) here if not already in config
        # z.B. edit .config oder dtb overlay für GPU/CPU max freq

        make olddefconfig O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

    - name: Build kernel
      run: |
        export ARCH=arm64
        export O=out
        export PATH=$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        make -j$(nproc) O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LD=ld.lld

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image
