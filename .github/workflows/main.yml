name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make python3 binutils-aarch64-linux-gnu

    - name: Download toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        git clone --depth=1 -b 17 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CLANG_PATH=$PWD/clang/bin
        export GCC64_PATH=$PWD/gcc64/bin
        export GCC32_PATH=$PWD/gcc32/bin
        export PATH=$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=$CLANG_PATH/clang
        export LD=$CLANG_PATH/ld.lld
        export AR=$CLANG_PATH/llvm-ar
        export NM=$CLANG_PATH/llvm-nm
        export OBJCOPY=$CLANG_PATH/llvm-objcopy
        export OBJDUMP=$CLANG_PATH/llvm-objdump
        export STRIP=$CLANG_PATH/llvm-strip
        make exynos9820-beyond1lte_defconfig
        make -j$(nproc)

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: arch/arm64/boot/Image
