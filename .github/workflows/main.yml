name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make

    - name: Download Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

     - name: Prepare Kernel Config
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PATH

        # Load default config
        make exynos9820-beyond1lte_defconfig

        # Disable VDSO and initramfs to avoid host execution errors
        scripts/config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --disable CONFIG_INITRAMFS_SOURCE
        scripts/config --disable CONFIG_ARM64_VDSO
        scripts/config --disable CONFIG_INITRAMFS_COMPRESSION_NONE
        scripts/config --disable CONFIG_INITRAMFS_COMPRESSION_GZIP
        scripts/config --disable CONFIG_INITRAMFS_COMPRESSION_XZ
        scripts/config --disable CONFIG_INITRAMFS_COMPRESSION_LZ4
        scripts/config --disable CONFIG_INITRAMFS_COMPRESSION_BZIP2

        # Disable stack protectors if causing build issues
        scripts/config --disable CONFIG_CC_STACKPROTECTOR
        scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG

        # Set CPU overclock (optional, for your .config tuning)
        # Hier kannst du Frequency-Limits setzen, z.B. 2.9GHz für S10
        scripts/config --enable CONFIG_SAMSUNG_EXYNOS_CPU_OVERDRIVE

        make olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        export CLANG_TRIPLE=aarch64-linux-gnu-

        # Build kernel
        make -j$(nproc) CC=clang LD=ld.lld \
             O=out

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: arch/arm64/boot/Image
