name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make

    - name: Download Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Build kernel
      run: |
        # Kernel Build Environment
        export ARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export PATH=$PWD/clang/bin:$PATH
        export LLVM=1
        export LLVM_IAS=1
        export LD=ld.lld

        # Kernel Configuration
        make exynos9820-beyond1lte_defconfig

        # Deaktiviere Funktionen, die Fehler verursachen
        scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        scripts/config --disable CONFIG_CC_STACKPROTECTOR
        scripts/config --disable CONFIG_ARM64_VDSO
        scripts/config --disable CONFIG_INITRAMFS_SOURCE

        # Optional: Overclock Einstellungen (CPU + GPU) einfügen
        scripts/config --set-val CONFIG_S10_CPU_OC 2900000000   # 2.9 GHz
        scripts/config --set-val CONFIG_S10_GPU_OC 800000000    # 800 MHz

        # Kernel Build
        make -j$(nproc) \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: arch/arm64/boot/Image
