name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make

    - name: Download Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH
        
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        export LLVM=1
        export LLVM_IAS=1
        
        make exynos9820-beyond1lte_defconfig
        
        scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        scripts/config --disable CONFIG_CC_STACKPROTECTOR
        
        make -j$(nproc) \
        CC=clang \
        CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: arch/arm64/boot/Image
