name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git make cpio

    - name: Download Clang
      run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Prepare kernel config
      run: |
        export ARCH=arm64
        mkdir -p out
        make O=out exynos9820-beyond1lte_defconfig

        # Disable Initramfs and VDSO for x86 build
        scripts/config --file out/.config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --file out/.config --disable CONFIG_INITRAMFS_SOURCE
        scripts/config --file out/.config --disable CONFIG_ARM64_VDSO
        scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR
        scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG

        # Update .config
        make O=out olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CC=clang
        export LD=ld.lld
        export CLANG_TRIPLE=aarch64-linux-gnu-
        make -j$(nproc) O=out CC=clang LD=ld.lld

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image
