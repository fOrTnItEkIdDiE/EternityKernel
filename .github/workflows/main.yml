name: Build Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build EternityKernel
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      O: out

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang lld bc bison flex libssl-dev libncurses5-dev crossbuild-essential-arm64

      - name: Prepare Kernel Config
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p $O
          cp defconfig $O/.config || true   # optional: falls du ein default defconfig hast
          make O=$O ARCH=$ARCH olddefconfig

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc) O=$O ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE CC=clang LD=ld.lld
