name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev libelf-dev git make python3 binutils-aarch64-linux-gnu \
          device-tree-compiler clang lld zip unzip

    - name: Download toolchains
      run: |
        mkdir -p $PWD/toolchains
        cd $PWD/toolchains
        # LineageOS 64-bit GCC
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/master.tar.gz -O gcc64.tar.gz
        tar -xf gcc64.tar.gz -C gcc64 --strip-components=1
        # LineageOS 32-bit GCC
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/master.tar.gz -O gcc32.tar.gz
        tar -xf gcc32.tar.gz -C gcc32 --strip-components=1
        # Standalone Clang 17 (public GitLab mirror)
        wget https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone/-/archive/17/clang-17.zip -O clang.zip
        unzip clang.zip -d clang
        cd $GITHUB_WORKSPACE

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CLANG_PATH=$PWD/toolchains/clang/bin
        export GCC64_PATH=$PWD/toolchains/gcc64/bin
        export GCC32_PATH=$PWD/toolchains/gcc32/bin
        export PATH=$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CC=$CLANG_PATH/clang
        export LD=$CLANG_PATH/ld.lld
        export AR=$CLANG_PATH/llvm-ar
        export NM=$CLANG_PATH/llvm-nm
        export OBJCOPY=$CLANG_PATH/llvm-objcopy
        export OBJDUMP=$CLANG_PATH/llvm-objdump
        export STRIP=$CLANG_PATH/llvm-strip
        make exynos9820-beyond1lte_defconfig
        scripts/config --file .config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        make olddefconfig O=out ARCH=arm64
        make -j$(nproc) O=out DTC=$(which dtc)

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image
