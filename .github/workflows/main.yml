name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev libelf-dev git make python3 \
          binutils-aarch64-linux-gnu device-tree-compiler ccache

    - name: Download toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        git clone --depth=1 -b 17 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone clang

    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH=$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CC=$PWD/clang/bin/clang
        export LD=$PWD/clang/bin/ld.lld
        export AR=$PWD/clang/bin/llvm-ar
        export NM=$PWD/clang/bin/llvm-nm
        export OBJCOPY=$PWD/clang/bin/llvm-objcopy
        export OBJDUMP=$PWD/clang/bin/llvm-objdump
        export STRIP=$PWD/clang/bin/llvm-strip
        export DTC=$(which dtc)
        export O=out
        make exynos9820-beyond1lte_defconfig
        scripts/config --file $O/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        make olddefconfig O=$O ARCH=arm64
        make -j$(nproc) O=$O ARCH=arm64 \
          CC=$CC LD=$LD AR=$AR NM=$NM OBJCOPY=$OBJCOPY OBJDUMP=$OBJDUMP STRIP=$STRIP DTC=$DTC

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image
