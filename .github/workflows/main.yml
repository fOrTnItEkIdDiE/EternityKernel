name: Build Kernel

on:
  push:
    branches: [ stable ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev git make python3

    - name: Setup Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup environment
      run: |
        mkdir -p out
        export PATH=$PWD/clang/bin:$PATH
        export ARCH=arm64
        export O=out
        export CC=clang

        make exynos9820-beyond1lte_defconfig O=out ARCH=arm64

        # optional tweaks (safe)
        scripts/config --file out/.config --disable CONFIG_ARM64_VDSO
        scripts/config --file out/.config --disable CONFIG_BLK_DEV_INITRD
        scripts/config --file out/.config --disable CONFIG_INITRAMFS_SOURCE

        make olddefconfig O=out ARCH=arm64

    - name: Build Kernel
      run: |
        export PATH=$PWD/clang/bin:$PATH
        export ARCH=arm64
        export O=out
        export CC=clang

        make -j$(nproc) O=out ARCH=arm64 CC=clang

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image
